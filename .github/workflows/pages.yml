name: Flutter Web

on:
  push:
    branches: [main, prac6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: node --test api/mock-server.test.js
      - name: Build release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8086/api' }}
        run: >-
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --dart-define=API_BASE_URL=$API_BASE_URL
          --no-web-resources-cdn --pwa-strategy=none
      - run: dart run tool/prepare_web.dart build/web --optimize
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
