name: Flutter Web

on:
  push:
    branches: [main, prac6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: node --test api/*.test.js
      - name: Build release
        run: >-
          flutter build web --release --base-href /
          --dart-define=API_BASE_URL=/api
          --no-web-resources-cdn --pwa-strategy=none
      - run: dart run tool/prepare_web.dart build/web --optimize
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
