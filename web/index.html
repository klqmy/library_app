<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Библиотечная система: каталог, читатели и выдачи книг.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Библиотека">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Библиотечная система</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #f6f7fb; color: #202127; font-family: Arial, sans-serif; }
    #startup { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; }
    #startup h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); font-weight: 500; }
    #startup p { margin: 0; }
    .spinner { width: 36px; height: 36px; border: 4px solid #d9dbef; border-top-color: #555b93; border-radius: 50%; animation: spin 1s linear infinite; }
    #startup button { padding: 10px 20px; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite">
    <h1>Библиотечная система</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="startup-message">Загрузка приложения…</p>
    <button id="startup-retry" type="button" hidden onclick="location.reload()">Повторить загрузку</button>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
